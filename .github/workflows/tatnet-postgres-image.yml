# TatNet fork: build supabase/postgres (Dockerfile-15) from an upstream release
# tag and push it to ghcr. Upstream tags 15.19.0.001 in git but publishes no
# image for it (checked 2026-09-28: neither Docker Hub nor public ECR), while
# the shared Supabase cluster must leave 15.8 for CVE-2026-2004/14669 and co.
#
# No functional changes: the branch is the upstream tag plus this workflow.
# Bump: branch tatnet/<new tag> from the upstream tag, cherry-pick this file,
# run with the matching image tag.
name: tatnet-postgres-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 15.19.0.001-tatnet1)"
        required: true
      dockerfile:
        description: "Dockerfile-15 (upstream image) or Dockerfile-15-patroni (HA layer on top)"
        required: true
        default: Dockerfile-15

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The Nix store for the full extension set does not fit the runner's
      # default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.dockerfile == 'Dockerfile-15' && 'production' || '' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/supabase-postgres:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
